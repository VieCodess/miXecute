apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-kapt"

/**
 * RN 0.74 — leave react {} defaults; native modules via settings.gradle applyNativeModulesSettingsGradle.
 */
react {
    // entryFile = file("../index.js")
}

/**
 * Soft-launch: keep release installable + readable.
 * R8 minify+shrink was leaving a black Arena (windowBackground only) after
 * Enter Arena when navigation/screens classes got stripped.
 * Re-enable minify only after ProGuard keep rules are device-QA'd.
 */
def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.xecute.app"
    defaultConfig {
        applicationId "com.xecute.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"

        // RevenueCat public SDK key (test). Override via gradle property revenueCatApiKey for release.
        buildConfigField "String", "REVENUECAT_API_KEY", "\"${project.findProperty("revenueCatApiKey") ?: "test_leIMUkfdupvCDVkEhzDGtXKgkxw"}\""
        buildConfigField "String", "REVENUECAT_ENTITLEMENT_ID", "\"xecute_pro\""
        // OneSignal App ID (public). Empty = fetch from /api/config/onesignal-push at runtime.
        buildConfigField "String", "ONESIGNAL_APP_ID", "\"${project.findProperty("oneSignalAppId") ?: ""}\""

        // Physical phones are arm64; keep APK in the 12–50MB range.
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    signingConfigs {
        debug {
            // Default Android debug keystore
        }
    }
    buildTypes {
        debug {
            // Dev-only: huge unminified DEX — do not distribute
        }
        release {
            // Installable size-optimized build (signed with debug key for sideload)
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "META-INF/versions/**"
        }
        jniLibs {
            // Smaller APK; unzip during install is fine for sideload
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    // Core icons only — material-icons-extended adds tens of MB
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.compose.ui:ui-tooling-preview"

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.google.android.material:material:1.12.0"

    // RevenueCat — subscriptions, Paywalls, Customer Center
    // https://www.revenuecat.com/docs/getting-started/installation/android
    implementation "com.revenuecat.purchases:purchases:10.23.3"
    implementation "com.revenuecat.purchases:purchases-ui:10.23.3"
}

// RevenueCat 10.x pulls Kotlin 2.1 stdlib; Room 2.6.1 kapt only reads metadata ≤2.0.
// Keep stdlib aligned with project kotlinVersion (1.9.24) for RN 0.74.
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24"
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
